# 주사위 영웅전 서버: Nakama(게임 서버) + PostgreSQL(데이터베이스) + Caddy(https 주소).
# 값(비밀번호·주소)은 setup.sh가 만든 .env에서 읽는다. .env는 저장소에 올리지 않는다.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 20

  nakama:
    image: heroiclabs/nakama:3.22.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address nakama:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama --name dice1
        --database.address nakama:${POSTGRES_PASSWORD}@postgres:5432/nakama
        --socket.server_key ${SERVER_KEY}
        --session.token_expiry_sec 604800
        --console.username admin
        --console.password ${CONSOLE_PASSWORD}
        --logger.level INFO
    volumes:
      - ./nakama/modules:/nakama/data/modules
    # 바깥에 직접 열지 않는다. 7350(API)은 Caddy만 쓰고, 7351(관리 화면)은 서버 안에서만 열린다.
    expose:
      - "7350"
      - "7351"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - nakama
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE: ${SITE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
