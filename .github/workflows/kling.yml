name: Kling video

# 클링(Kling) API로 판 위 말 동작 영상을 만든다. claude/kling으로 시작하는 브랜치에서 주문서(kling/jobs.json·kling/ref)가 바뀌면 돈다.
# API 키는 저장소 비밀값 KLING_API_KEY에서만 읽는다. 받은 영상은 같은 브랜치의 kling/out/에 올린다(이 올림은 작업을 다시 부르지 않는다).
on:
  workflow_dispatch:
  push:
    branches: ['claude/kling**']
    paths: ['kling/jobs.json', 'kling/ref/**']

permissions:
  contents: write

jobs:
  kling:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 준비
        run: pip install --quiet requests
      - name: 클링으로 영상 만들기
        run: python3 -u tools/kling_run.py
      - name: 영상 올리기
        if: always()
        run: |
          git config user.name "kling-bot"
          git config user.email "kling-bot@users.noreply.github.com"
          git add kling/out || true
          if git diff --cached --quiet; then echo "새 영상 없음"; exit 0; fi
          git commit -m "클링 영상 받음"
          git push
