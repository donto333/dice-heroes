name: Auto merge

# claude/로 시작하는 브랜치의 PR은 Build가 통과하면 자동으로 main에 합친다.
# 합친 뒤에는 Build를 main에서 다시 돌려 웹에 배포한다.
# (GitHub 규칙상 자동으로 합친 변경은 Build를 스스로 다시 부르지 않아서 직접 부른다.)
#
# 자동 합치기를 멈추려면 이 파일을 지우면 된다.

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 빌드가 통과한 PR 합치기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # 빌드한 커밋이 PR의 최신 커밋일 때만 합친다. 그 사이 새 커밋이 올라왔으면 다음 빌드를 기다린다.
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,headRefOid \
            -q ".[] | select(.headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "합칠 PR이 없습니다. (이미 합쳤거나, 새 커밋이 올라왔거나, PR이 닫힘)"
            exit 0
          fi
          gh pr merge "$pr" -R "$REPO" --merge --delete-branch
          gh workflow run build.yml -R "$REPO" --ref main
          echo "PR #$pr 을 합치고 배포를 시작했습니다."
