name: Build

# 올릴 때마다 Godot로 웹 버전을 빌드한다.
# main 브랜치에서는 GitHub Pages와 Cloudflare Pages(비밀값이 있을 때)로 배포해 브라우저에서 바로 해 볼 수 있게 한다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot와 내보내기 템플릿 받기
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip -d "${RUNNER_TEMP}/godot"
          mv "${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" "${RUNNER_TEMP}/godot/godot"
          chmod +x "${RUNNER_TEMP}/godot/godot"
          echo "${RUNNER_TEMP}/godot" >> "${GITHUB_PATH}"
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "${template_dir}"
          unzip -q templates.tpz -d "${RUNNER_TEMP}/tpl"
          mv "${RUNNER_TEMP}/tpl/templates/"* "${template_dir}/"
          rm -f godot.zip templates.tpz

      - name: 리소스 가져오기
        run: godot --headless --import

      - name: 규칙 테스트
        run: godot --headless --script res://tests/run_tests.gd

      - name: 화면 실행 검사
        # 첫 화면을 잠깐 띄워 보고, 스크립트 오류가 찍히면 실패로 처리한다.
        run: |
          godot --headless --quit-after 300 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" run.log; then
            echo "화면 실행 중 스크립트 오류가 있습니다."
            exit 1
          fi

      - name: 화면 사진 찍기
        # 가상 화면으로 게임을 띄워 주요 장면을 사진으로 남긴다. 화면 확인용이라 실패해도 빌드는 계속한다.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export SHOT_DIR="${RUNNER_TEMP}/screenshots"
          LIBGL_ALWAYS_SOFTWARE=1 timeout 420 xvfb-run -a -s "-screen 0 800x1400x24" \
            godot --rendering-driver opengl3 --resolution 1280x720 --script res://tools/capture.gd 2>&1 | grep -v "^SHOT" | tail -60
          ls -la "${SHOT_DIR}" || true
          # 사진을 글자(base64)로 로그에 남긴다. 작업 공간에서 로그로 사진을 되살려 볼 수 있다.
          for f in "${SHOT_DIR}"/*.png; do
            name=$(basename "$f")
            base64 -w 3000 "$f" | sed "s/^/SHOT ${name} /"
          done

      - name: 화면 사진 보관
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

      - name: 웹 버전 내보내기
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          # 휴대폰 홈 화면에 앱처럼 추가할 수 있게 앱 정보(manifest)와 아이콘을 함께 넣는다.
          cp web/manifest.webmanifest build/web/
          cp assets/app_icon/icon_192.png build/web/app-icon-192.png
          cp assets/app_icon/icon_512.png build/web/app-icon-512.png

      - name: 새 버전이 바로 보이게 파일 이름 바꾸기
        # 브라우저가 예전 게임 파일(index.pck)을 기억해 두는 문제를 막는다.
        # 배포마다 다른 이름(index-커밋번호.pck)으로 복사하고 index.html이 그 파일을 읽게 한다.
        # 예전 index.html을 기억한 브라우저를 위해 index.pck도 남겨 둔다.
        run: |
          version="${GITHUB_SHA::12}"
          cp build/web/index.pck "build/web/index-${version}.pck"
          sed -i "s/\"executable\":\"index\",/\"executable\":\"index\",\"mainPack\":\"index-${version}.pck\",/" build/web/index.html
          sed -i "s/\"index.pck\":/\"index-${version}.pck\":/" build/web/index.html
          grep -q "\"mainPack\":\"index-${version}.pck\"" build/web/index.html
          grep -o 'GODOT_CONFIG = {[^;]*' build/web/index.html

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Pages용 묶음 올리기
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    # Pages가 꺼져 있거나 요금제가 지원하지 않으면 이 단계만 실패하고 빌드는 성공으로 남는다.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    # Cloudflare Pages에도 같은 웹 버전을 올린다(주소: https://dice-heroes.pages.dev).
    # 저장소 비밀값 CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID가 없으면 아무것도 하지 않고 넘어간다.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: dice-heroes
    steps:
      - name: 비밀값 확인
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare 비밀값이 없어 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌드 결과 받기
        if: steps.check.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Cloudflare Pages 프로젝트 만들기(처음 한 번)
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main || echo "이미 있음"

      - name: Cloudflare Pages에 올리기
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy build/web --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
