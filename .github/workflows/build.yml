name: Build

# 카드 편성의 웹 배포 전용 브랜치에서만 실행한다.
on:
  push:
    branches: [codex/web-deploy-card-deck-responsive]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot와 내보내기 템플릿 받기
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip -d "${RUNNER_TEMP}/godot"
          mv "${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" "${RUNNER_TEMP}/godot/godot"
          chmod +x "${RUNNER_TEMP}/godot/godot"
          echo "${RUNNER_TEMP}/godot" >> "${GITHUB_PATH}"
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "${template_dir}"
          unzip -q templates.tpz -d "${RUNNER_TEMP}/tpl"
          mv "${RUNNER_TEMP}/tpl/templates/"* "${template_dir}/"
          rm -f godot.zip templates.tpz

      - name: 리소스 가져오기
        run: godot --headless --import

      - name: 규칙 테스트
        run: godot --headless --script res://tests/run_tests.gd

      - name: 화면 실행 검사
        # 첫 화면을 잠깐 띄워 보고, 스크립트 오류가 찍히면 실패로 처리한다.
        run: |
          godot --headless --quit-after 300 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" run.log; then
            echo "화면 실행 중 스크립트 오류가 있습니다."
            exit 1
          fi

      - name: 버전 번호 적기
        # 게임 버전 = data/version.json의 base + 이 Build 실행 번호(배포마다 저절로 오름).
        run: |
          python3 - <<'PY'
          import json, os, datetime
          path = "data/version.json"
          info = json.load(open(path, encoding="utf-8"))
          info["build"] = int(os.environ["GITHUB_RUN_NUMBER"])
          info["commit"] = os.environ["GITHUB_SHA"][:7]
          info["time"] = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y-%m-%d %H:%M")
          json.dump(info, open(path, "w", encoding="utf-8"), ensure_ascii=False)
          print("버전", info["base"] + "." + str(info["build"]), info)
          PY

      - name: 웹 버전 내보내기
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          # 휴대폰 홈 화면에 앱처럼 추가할 수 있게 앱 정보(manifest)와 아이콘을 함께 넣는다.
          cp web/manifest.webmanifest build/web/
          cp assets/app_icon/icon_192.png build/web/app-icon-192.png
          cp assets/app_icon/icon_512.png build/web/app-icon-512.png
          # Cloudflare Pages: 시작 파일(index.html)은 브라우저가 기억해 두지 말고 늘 새로 받게 한다.
          printf '/\n  Cache-Control: no-cache\n/index.html\n  Cache-Control: no-cache\n' > build/web/_headers

      - name: 새 버전이 바로 보이게 파일 이름 바꾸기
        # 브라우저가 예전 게임 파일(index.pck)을 기억해 두는 문제를 막는다.
        # 배포마다 다른 이름(index-커밋번호.pck)으로 복사하고 index.html이 그 파일을 읽게 한다.
        # 예전 index.html을 기억한 브라우저를 위해 index.pck도 남겨 둔다.
        run: |
          version="${GITHUB_SHA::12}"
          cp build/web/index.pck "build/web/index-${version}.pck"
          sed -i "s/\"executable\":\"index\",/\"executable\":\"index\",\"mainPack\":\"index-${version}.pck\",/" build/web/index.html
          sed -i "s/\"index.pck\":/\"index-${version}.pck\":/" build/web/index.html
          grep -q "\"mainPack\":\"index-${version}.pck\"" build/web/index.html
          grep -o 'GODOT_CONFIG = {[^;]*' build/web/index.html

      - name: 바로 전 버전 게임 파일도 남기기
        # GitHub Pages는 index.html을 10분쯤 기억해 둔다. 그 사이 새로 배포되면 예전 index.html이
        # 지워진 예전 게임 파일(index-예전커밋.pck)을 찾다가 "Failed loading file"이 뜬다.
        # 그래서 지금 사이트에 올라가 있는 게임 파일을 받아 새 배포에도 함께 넣어 둔다.
        continue-on-error: true
        run: |
          site="https://donto333.github.io/dice-heroes"
          old=$(curl -fsSL "$site/index.html" | grep -o 'index-[0-9a-f]\{12\}\.pck' | head -1 || true)
          if [ -n "$old" ] && [ ! -f "build/web/$old" ]; then
            curl -fsSL -o "build/web/$old" "$site/$old" && echo "전 버전 $old 를 남겼습니다." || rm -f "build/web/$old"
          else
            echo "남길 전 버전 파일이 없습니다."
          fi

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Pages용 묶음 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
